name: CI/CD to Kubernetes

on:
  push:
    branches: [ "master" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. PHP check (syntax of all files)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite

      - name: Lint PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      # 3. Docker login GHCR
      - name: Login GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 4. Build image
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:latest

      # 5. Push image
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

      # 6. Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # 7. Configure kubeconfig
      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      # 8. Deploy to Kubernetes
      - name: Deploy
        run: |
          kubectl apply -f k8s/pvc.yaml -n my-apps
          kubectl apply -f k8s/deployment.yaml -n my-apps
          kubectl apply -f k8s/service.yaml -n my-apps
          kubectl rollout restart deployment my-receipts -n my-apps
          kubectl rollout status deployment my-receipts -n my-apps --timeout=180s
