ServerTokens Prod
ServerSignature Off

# База данных и служебный код — закрыты для посетителей
<Directory /var/www/html/wife-recipes/data>
    Require all denied
</Directory>
<Directory /var/www/html/wife-recipes/includes>
    Require all denied
</Directory>

# В папке с фото нельзя выполнять скрипты
<Directory /var/www/html/wife-recipes/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Служебные файлы в корне
<FilesMatch "^(router\.php|start\.bat|Dockerfile|README\.md)$">
    Require all denied
</FilesMatch>

# Сайт живёт по префиксу /wife-recipes/ — корень перенаправляем туда
RedirectMatch 302 ^/$ /wife-recipes/
